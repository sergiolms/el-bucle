<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.15" stroke="#ff1493" stroke-width="2" fill="none">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Circular border -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00d9ff" stroke-width="4" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ff1493" stroke-width="6" opacity="0.5" filter="url(#glow)"/>

  <!-- "EB" Text -->
  <text x="256" y="300" font-family="monospace, 'Courier New'" font-size="180" font-weight="bold"
        text-anchor="middle" fill="#ff1493" filter="url(#glow)">
    EB
  </text>

  <!-- Infinity symbol (bucle) -->
  <path d="M 200 420 Q 180 440 160 440 Q 130 440 130 420 Q 130 400 160 400 Q 180 400 200 420
           M 200 420 Q 220 400 240 400 Q 270 400 270 420 Q 270 440 240 440 Q 220 440 200 420"
        fill="none" stroke="#00d9ff" stroke-width="3" filter="url(#glow)"/>
</svg>
